[project]
name = "minieyes"
version = "0.1.0"
description = "MiniEyes workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/detector", "apps/event-api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "respx>=0.21",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["minieyes_detector", "minieyes_api", "scripts"]

# Repo-level tests (tests/images, tests/e2e); each app keeps its own pytest config.
[tool.pytest.ini_options]
markers = [
    "integration: needs Docker or external services",
    "e2e: needs the docker compose stack running",
]

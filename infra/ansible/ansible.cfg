# Ansible ignores ansible.cfg in a world-writable working directory (e.g. a
# Windows checkout seen through WSL /mnt/c). The Makefile therefore exports
# ANSIBLE_CONFIG pointing at this file.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
nocows = true

[ssh_connection]
pipelining = true

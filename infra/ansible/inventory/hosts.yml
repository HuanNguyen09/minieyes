---
# The edge node's public IP is not stored in Git. It comes from Terraform:
#
#   export EDGE_HOST="$(terraform -chdir=infra/terraform/envs/lab output -raw edge_public_ip)"
#   export ADMIN_CIDR="203.0.113.10/32"   # same value as Terraform var.admin_cidr
#
# See docs/runbooks/edge-node-ansible.md.
all:
  children:
    edge:
      hosts:
        edge-01:
          ansible_host: "{{ lookup('ansible.builtin.env', 'EDGE_HOST') }}"
          ansible_user: ubuntu

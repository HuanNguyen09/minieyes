---
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: "yes"
  when: common_apt_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Enable periodic apt updates and unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades behaviour
  ansible.builtin.template:
    src: 52minieyes-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52minieyes-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Keep the unattended-upgrades service enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

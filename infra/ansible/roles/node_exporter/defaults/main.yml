---
node_exporter_version: "1.12.1"
# sha256 of node_exporter-<version>.linux-<arch>.tar.gz from the release's sha256sums.txt
node_exporter_checksums:
  amd64: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
  arm64: ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7

# The in-cluster Alloy agent scrapes node_exporter through the node IP, so it
# binds all interfaces; ufw (common role) only lets the k3s pod/service
# networks in and the Security Group allows SSH only. Set to
# "127.0.0.1:9100" if the scraper runs with hostNetwork.
node_exporter_listen_address: "0.0.0.0:9100"

node_exporter_collectors_disabled:
  - wifi
  - infiniband
  - nfs
  - nfsd

node_exporter_user: node-exporter
node_exporter_install_dir: /opt/node_exporter
node_exporter_binary: /usr/local/bin/node_exporter

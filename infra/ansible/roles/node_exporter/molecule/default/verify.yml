---
- name: Verify node_exporter role
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read service state
      ansible.builtin.service_facts:

    - name: Node_exporter service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['node_exporter.service'].state == 'running'
          - ansible_facts.services['node_exporter.service'].status == 'enabled'

    - name: Fetch /metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_verify_metrics
      retries: 10
      delay: 2
      until: node_exporter_verify_metrics.status == 200

    - name: Node_exporter serves metrics at the pinned version
      ansible.builtin.assert:
        that:
          - "'node_cpu_seconds_total' in node_exporter_verify_metrics.content"
          - "'version=\"1.12.1\"' in node_exporter_verify_metrics.content"

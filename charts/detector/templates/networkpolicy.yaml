{{- if .Values.networkPolicy.enabled }}
# Default deny for the detector pods: only the flows below are allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "detector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "detector.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: triton }
      ports:
        - { protocol: TCP, port: 8001 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: camera-sim }
      ports:
        - { protocol: TCP, port: 8554 }
    {{- range .Values.networkPolicy.cameraCIDRs }}
    - to:
        - ipBlock: { cidr: {{ . }} }
      ports:
        - { protocol: TCP, port: {{ $.Values.networkPolicy.cameraPort }} }
    {{- end }}
    # Event API through the cloud load balancer: by default HTTPS to public addresses only.
    # NetworkPolicy cannot match hostnames; private ranges stay blocked.
    {{- with .Values.networkPolicy.eventApiEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
            {{- with .except }}
            except: {{ toJson . }}
            {{- end }}
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
{{- end }}

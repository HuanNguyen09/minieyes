apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: camera-sim
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: minieyes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: camera-sim
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: camera-sim
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: minieyes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: camera-sim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rtsp
              containerPort: 8554
          readinessProbe:
            tcpSocket: { port: rtsp }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: rtsp }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# Runs Alembic on every sync. Argo CD: a Sync hook in wave 0, after Postgres (wave -1) is
# healthy and before the API (wave 1). Helm: after the first install creates Postgres, and
# before each upgrade. A PreSync hook would run before Postgres exists on the first sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "event-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6  # the database may still be starting on the first install
  template:
    metadata:
      labels:
        {{- include "event-api.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "event-api.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, minieyes_api.migrate]
          env:
            {{- include "event-api.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "event-api.containerSecurityContext" . | nindent 12 }}

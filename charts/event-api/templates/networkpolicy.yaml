{{- if .Values.networkPolicy.enabled }}
# Default deny for the API pods (and its migration Job, which shares the selector labels).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "event-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "event-api.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- else }}
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.externalDatabaseCIDR }} }
      ports:
        - { protocol: TCP, port: 5432 }
    {{- end }}
{{- if .Values.postgres.enabled }}
---
# Postgres accepts only the API and its migration Job, and initiates nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: minieyes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "event-api.selector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
{{- end }}

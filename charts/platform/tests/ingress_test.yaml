suite: platform ingresses
templates:
  - ingresses.yaml
  - middleware.yaml
release:
  name: platform
  namespace: argocd
set:
  baseDomain: 203-0-113-10.sslip.io
tests:
  - it: exposes events, metrics, logs and grafana under the base domain
    template: ingresses.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: spec.rules[0].host
          value: events.203-0-113-10.sslip.io
        documentIndex: 0
      - equal:
          path: spec.rules[0].host
          value: metrics.203-0-113-10.sslip.io
        documentIndex: 1
      - equal:
          path: spec.rules[0].host
          value: logs.203-0-113-10.sslip.io
        documentIndex: 2
      - equal:
          path: spec.rules[0].host
          value: grafana.203-0-113-10.sslip.io
        documentIndex: 3

  - it: routes each host to its service in its own namespace
    template: ingresses.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: minieyes
        documentIndex: 0
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value: { name: event-api, port: { number: 8000 } }
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: monitoring
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value: { name: kube-prometheus-stack-prometheus, port: { number: 9090 } }
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value: { name: loki, port: { number: 3100 } }
        documentIndex: 2

  - it: publishes only the push endpoints of Prometheus and Loki
    template: ingresses.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /api/v1/write
            pathType: Exact
            backend: { service: { name: kube-prometheus-stack-prometheus, port: { number: 9090 } } }
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /loki/api/v1/push
        documentIndex: 2

  # Source IPs are filtered at L7 (Traefik ipAllowList), not on the NLB: Let's Encrypt must reach
  # the HTTP-01 solver route, which cert-manager creates without these middlewares.
  - it: allow-lists every host, and adds basic auth on metrics and logs only (events checks X-API-Key)
    template: ingresses.yaml
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: minieyes-ip-allowlist@kubernetescrd
        documentIndex: 0
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: monitoring-ip-allowlist@kubernetescrd,monitoring-push-basic-auth@kubernetescrd
        documentIndex: 1
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: monitoring-ip-allowlist@kubernetescrd,monitoring-push-basic-auth@kubernetescrd
        documentIndex: 2
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: monitoring-ip-allowlist@kubernetescrd
        documentIndex: 3

  - it: gives every Ingress TLS and a cert-manager cluster issuer
    template: ingresses.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.tls[0].secretName
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt

  - it: takes basic-auth users from a Secret, never from values
    template: middleware.yaml
    documentSelector:
      path: metadata.name
      value: push-basic-auth
    asserts:
      - equal:
          path: spec.basicAuth.secret
          value: push-basic-auth
      - equal:
          path: metadata.namespace
          value: monitoring

  - it: refuses to render without a base domain
    template: ingresses.yaml
    set:
      baseDomain: ""
    asserts:
      - failedTemplate:
          errorPattern: "baseDomain is required"

  - it: allow-lists the edge EIP and admin CIDR in both namespaces
    template: middleware.yaml
    set:
      traefik:
        sourceRanges: [198.51.100.7/32, 203.0.113.0/28]
    asserts:
      # documents: 0 push-basic-auth, 1 ip-allowlist (minieyes), 2 ip-allowlist (monitoring)
      - equal:
          path: metadata.namespace
          value: minieyes
        documentIndex: 1
      - equal:
          path: spec.ipAllowList.sourceRange
          value: [198.51.100.7/32, 203.0.113.0/28]
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: monitoring
        documentIndex: 2
      - equal:
          path: spec.ipAllowList.sourceRange
          value: [198.51.100.7/32, 203.0.113.0/28]
        documentIndex: 2

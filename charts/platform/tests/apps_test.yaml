suite: platform applications
templates:
  - apps.yaml
release:
  name: platform
  namespace: argocd
set:
  baseDomain: 203-0-113-10.sslip.io
  traefik:
    sourceRanges: [198.51.100.7/32, 203.0.113.0/28]
tests:
  # HTTP-01 needs port 80 open to Let's Encrypt, so the NLB is not source-restricted; client
  # IPs are kept (externalTrafficPolicy Local) and filtered per route by the ip-allowlist middleware.
  - it: installs a pinned Traefik behind an NLB that keeps client source IPs
    documentSelector:
      path: metadata.name
      value: traefik
    asserts:
      - equal:
          path: spec.source.targetRevision
          value: 41.6.1
      - equal:
          path: spec.source.helm.valuesObject.service.spec.externalTrafficPolicy
          value: Local
      - notExists:
          path: spec.source.helm.valuesObject.service.spec.loadBalancerSourceRanges
      - equal:
          path: spec.source.helm.valuesObject.service.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb

  - it: installs a pinned cert-manager with its CRDs first
    documentSelector:
      path: metadata.name
      value: cert-manager
    asserts:
      - equal:
          path: spec.source.targetRevision
          value: v1.21.2
      - equal:
          path: spec.source.helm.valuesObject.crds.enabled
          value: true
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: refuses to open the load balancer to the whole internet
    set:
      traefik:
        sourceRanges: [0.0.0.0/0]
    asserts:
      - failedTemplate:
          errorPattern: "must not include 0.0.0.0/0"

  # Traefik chart >= 41 moved redirections under ports.web.http; the ACME HTTP-01 challenge
  # must bypass the redirect or Let's Encrypt never sees the token on port 80.
  - it: redirects HTTP to HTTPS except for ACME challenges
    documentSelector:
      path: metadata.name
      value: traefik
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.ports.web.http.redirections.entryPoint
          value: { to: websecure, scheme: https, permanent: true }
      - equal:
          path: spec.source.helm.valuesObject.ports.web.allowACMEByPass
          value: true
      - notExists:
          path: spec.source.helm.valuesObject.ports.web.redirections

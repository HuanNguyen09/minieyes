apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: minieyes
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: minieyes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # triton-server user in the NGC image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model
          image: {{ .Values.model.image }}
          imagePullPolicy: {{ .Values.model.pullPolicy }}
          command: [sh, -c, "cp -R /models/. /shared/"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /shared
      containers:
        - name: triton
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [tritonserver]
          args:
            - --model-repository=/models
            - --strict-readiness=true
            - --log-verbose=0
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 8001 }
            - { name: metrics, containerPort: 8002 }
          startupProbe:
            httpGet: { path: /v2/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 60  # loading the backend can take a while on a cold node
          livenessProbe:
            httpGet: { path: /v2/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # Triton writes caches outside /tmp; a read-only root filesystem is not verified yet
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

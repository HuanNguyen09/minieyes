# One simulated IP camera: rtsp://<host>:8554/cam1, H.264 at 5 fps, looping forever.
logLevel: info
api: yes
apiAddress: :9997
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  cam1:
    # ffmpeg publishes the looped video into this path; MediaMTX restarts it if it exits
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /media/sample.mp4
      -vf fps=5 -an -c:v libx264 -preset veryfast -tune zerolatency -g 10
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

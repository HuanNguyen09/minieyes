# Alertmanager config for MiniEyes (FR-PLT-6, PRD §7.3).
# Loaded by kube-prometheus-stack through alertmanagerSpec.configSecret
# (see observability/README.md). Contains NO secrets:
#   - the Telegram bot token is read from the Kubernetes Secret
#     `alertmanager-telegram` (key `bot-token`), mounted by the operator at
#     /etc/alertmanager/secrets/alertmanager-telegram/ via alertmanagerSpec.secrets;
#   - chat_id is a placeholder; set the real chat id in the GitOps copy
#     (a chat id is not a credential: without the token it cannot be used).
# Tests: bash observability/alertmanager/test.sh, pytest observability.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  # One Telegram message per alert name and site, not one per camera/pod.
  group_by: [alertname, site]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # kube-prometheus-stack's dead-man's-switch and info inhibitor never page.
    - receiver: "null"
      matchers:
        - alertname =~ "Watchdog|InfoInhibitor"
    - receiver: "null"
      matchers:
        - severity = "info"
    # Critical alerts go out fast (goal: Telegram within 2 minutes) and repeat hourly.
    - receiver: telegram
      matchers:
        - severity = "critical"
      group_wait: 10s
      repeat_interval: 1h
    - receiver: telegram
      matchers:
        - severity = "warning"

inhibit_rules:
  # A silent site explains every other alert of that site (drill #6).
  - source_matchers:
      - alertname = "EdgeSiteSilent"
    target_matchers:
      - alertname != "EdgeSiteSilent"
    equal: [site]
  # A critical alert hides the warning twin of the same alert and site.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, site]
  # kube-prometheus-stack convention: info alerts only show with a real alert.
  - source_matchers:
      - alertname = "InfoInhibitor"
    target_matchers:
      - severity = "info"
    equal: [namespace]

receivers:
  - name: "null"
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
        chat_id: -1000000000000 # PLACEHOLDER: replace with the real chat id
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} <b>{{ .CommonLabels.alertname }}</b> · {{ .CommonLabels.site }} · {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ if eq $.Status "firing" }}{{ .Annotations.description }}{{ end }}
          <a href="{{ .Annotations.runbook_url }}">runbook</a>
          {{ end }}

# GENERATED by observability/scripts/build_prometheusrule.py from
# observability/alerts/*.rules.yaml. Do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minieyes
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: minieyes
spec:
  groups:
  - name: minieyes-detector
    rules:
    - alert: CameraDown
      expr: minieyes_camera_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Camera {{ $labels.camera }} at {{ $labels.site }} is down
        description: 'minieyes_camera_up has been 0 for more than 1 minute: the detector cannot read the RTSP stream of {{ $labels.camera }}.'
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/camera-down.md
    - alert: DetectorDown
      expr: max by (site) (up{job="detector"}) == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Detector at {{ $labels.site }} is down
        description: 'The detector at {{ $labels.site }} has not been scraped for 2 minutes: no camera is being watched there.'
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/detector-down.md
    - alert: LowFPS
      expr: |
        (
          sum by (site, camera) (rate(minieyes_frames_total[2m])) < 2
        )
        and on (site, camera)
        (
          max by (site, camera) (minieyes_camera_up) == 1
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Camera {{ $labels.camera }} at {{ $labels.site }} runs below 2 fps
        description: 'rate(minieyes_frames_total) has been below 2 frames per second for 5 minutes while the camera is up: inference is too slow or frames are being dropped.'
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/low-fps.md
    - alert: HighInferenceLatency
      expr: |
        histogram_quantile(0.95,
          sum by (site, le) (rate(minieyes_inference_seconds_bucket[5m]))
        ) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Inference p95 above 0.5s at {{ $labels.site }}
        description: The 95th percentile of minieyes_inference_seconds has been above 0.5 seconds for 5 minutes. Triton is overloaded, throttled or starved of CPU.
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/high-inference-latency.md
  - name: minieyes-platform
    rules:
    - alert: PodCrashLooping
      expr: |
        label_replace(
          increase(kube_pod_container_status_restarts_total[15m]) > 3,
          "site", "cloud", "site", ""
        )
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping at {{ $labels.site }}
        description: Container {{ $labels.container }} restarted more than 3 times in the last 15 minutes. Check the last state reason (OOMKilled, Error) and the previous container logs.
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/pod-crash-looping.md
    - alert: DiskWillFillIn24h
      expr: |
        predict_linear(
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[1h],
          24 * 3600
        ) < 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Disk {{ $labels.mountpoint }} on {{ $labels.instance }} at {{ $labels.site }} will fill within 24h
        description: At the trend of the last hour, free space on {{ $labels.mountpoint }} ({{ $labels.device }}) reaches zero within 24 hours.
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/disk-will-fill-in-24h.md
    - alert: DiskAlmostFull
      expr: |
        node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"} < 0.15
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Disk {{ $labels.mountpoint }} on {{ $labels.instance }} at {{ $labels.site }} is almost full
        description: Less than 15% free on {{ $labels.mountpoint }} ({{ $labels.device }}) for 5 minutes. Kubelet starts evicting pods at 10% (DiskPressure).
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/disk-will-fill-in-24h.md
  - name: minieyes-fleet
    rules:
    - alert: EdgeSiteSilent
      expr: |
        group by (site) (max_over_time(up{site!=""}[1h]))
        unless
        group by (site) (up{site!=""})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Edge site {{ $labels.site }} stopped sending data
        description: '{{ $labels.site }} sent metrics within the last hour but has sent nothing for several minutes. The edge node, its network egress or Grafana Alloy is down. Other alerts for this site are inhibited.'
        runbook_url: https://github.com/HuanNguyen09/minieyes/blob/main/docs/runbooks/edge-site-silent.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.3
      helm:
        valueFiles:
          - $app/observability/alloy/values.yaml
          - $values/sites/site-01/values/alloy.yaml
    - repoURL: https://github.com/HuanNguyen09/minieyes.git
      targetRevision: b9a7949c75842db20259e2d69ed1612e610fe997
      ref: app
    - repoURL: https://github.com/HuanNguyen09/minieyes-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/HuanNguyen09/minieyes.git
      targetRevision: b9a7949c75842db20259e2d69ed1612e610fe997
      path: observability/alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: baseline

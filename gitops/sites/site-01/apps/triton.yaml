apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: triton
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://github.com/HuanNguyen09/minieyes.git
      targetRevision: bca1de4b1adf9998fb93717e6e1df8c9dde381da
      path: charts/triton
      helm:
        valueFiles: [$values/sites/site-01/values/triton.yaml]
    - repoURL: https://github.com/HuanNguyen09/minieyes-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: minieyes
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted

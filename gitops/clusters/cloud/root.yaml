# App of Apps: Argo CD on this cluster syncs everything under clusters/cloud/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HuanNguyen09/minieyes-gitops.git
    targetRevision: main
    path: clusters/cloud/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }

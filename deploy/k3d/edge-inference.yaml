# The 15 GB Triton image does not fit the lab (ADR-005): OVMS serves the same model over the
# same KServe v2 gRPC API, behind the Service name and labels the detector expects ("triton").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: minieyes
  labels: { app.kubernetes.io/name: triton, app.kubernetes.io/part-of: minieyes }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: triton }
  template:
    metadata:
      labels: { app.kubernetes.io/name: triton, app.kubernetes.io/part-of: minieyes }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: model
          image: k3d-minieyes-registry:15000/minieyes-model-yolov8n:dev
          command: [sh, -c, "cp -R /models/. /shared/"]
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: models, mountPath: /shared }]
      containers:
        - name: ovms
          image: openvino/model_server:2026.3.1
          args: [--model_name=yolov8n, --model_path=/models/yolov8n, --port=8001, --rest_port=8000]
          ports:
            - { name: grpc, containerPort: 8001 }
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: http }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: *hardened
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: models, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: minieyes
spec:
  selector: { app.kubernetes.io/name: triton }
  ports:
    - { name: grpc, port: 8001, targetPort: grpc }

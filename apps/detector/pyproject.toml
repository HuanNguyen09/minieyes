[project]
name = "minieyes-detector"
version = "0.1.0"
description = "Edge detector: RTSP frames -> Triton YOLO -> red-zone events"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "tritonclient[grpc]>=2.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minieyes_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e' --strict-markers"
markers = [
    "integration: needs Docker or external services",
    "e2e: needs the docker compose stack running",
]

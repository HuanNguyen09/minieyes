[project]
name = "minieyes-api"
version = "0.1.0"
description = "Cloud Event API for MiniEyes intrusion events"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minieyes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e' --strict-markers"
markers = [
    "integration: needs Docker or external services",
    "e2e: needs the docker compose stack running",
]

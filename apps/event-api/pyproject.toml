[project]
name = "minieyes-api"
version = "0.1.0"
description = "Cloud Event API for MiniEyes intrusion events"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minieyes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e' --strict-markers"
markers = [
    "integration: needs Docker or external services",
    "e2e: needs the docker compose stack running",
]
filterwarnings = [
    # Starlette's TestClient nags about httpx; tests use it deliberately.
    "ignore:Using `httpx` with `starlette.testclient`",
]
